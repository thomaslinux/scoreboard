<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Save multiple counter configuration like scores or number of beers consumed">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="css/light.css">
</head>
<body>
    <main>
        <h1>Scoreboard</h1>
        <nav class="gameChoice">
            <button class="button1"><span>gameName</span></button>
            <button class="plus">+</button>
        </nav>
        <nav class="playerChoice">
            <button class="players1"><span>Players</span></button>
            <button class="plus">+</button>
        </nav>
        <nav class="configChoice">
            <button class="simpleCounter">- 0 +</button>
            <button class="Total">0+0 = 0</button>
        </nav>
        <div class="board">
            <input type="text" name="player1" id="player1"><input type="number" name="number1">
            <button class="plus">+</button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
