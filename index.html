<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Save multiple counter configuration like scores or number of beers consumed">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="css/light.css">
</head>
<body>
    <main>
        <h1>Scoreboard</h1>
        <h2>gameChoice</h2><nav class="gameChoice">
            <button id="game1"><span>gameName</span></button>
            <button class="add" id="addGameChoice">+</button>
        </nav>
        <h2>playerChoice</h2><nav class="playerChoice">
            <button id="playerList1"><span>Players</span></button>
            <button class="add" id="addPlayerChoice">+</button>
        </nav>
        <h2>configChoice</h2><nav class="configChoice">
            <button id="bowling">Bowling</button>
            <button id="beers">Beer counter</button>
        </nav>
        <h2>playerList</h2><div class="playerList">
            <input type="text" name="player1" id="player1">
            <button id="minus1">-</button>
            <span role="textbox" contenteditable inputmode="numeric" pattern="[0-9]*"></span>
            <button id="plus1">+</button>
            <button class="add" id="addPlayer">+</button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
